[package]
name = "fondation-13-1"
version = "0.2.0"
edition = "2021"
description = "Fonctions Recevoir (F1-2), Router (F1-3), Découvrir (F1-4), Juger (F1-5), Exécuter (F1-6), Mémoriser (F1-7), Vision (F1-8) et Action (F1-9) de la Fondation 13 → 1 (D-N055) : validateur R10 v1 + consignateur, routeur de dispatch, validateur de Discover, jugement de PR, exécution de merge, citation de fait, état de vision et action sans question préalable — code A'Space neuf, zéro dépendance, zéro télémétrie"
license = "Apache-2.0"

[lib]
name = "r10_validator"
path = "src/lib.rs"

[[bin]]
name = "r10-receive"
path = "src/bin/r10-receive.rs"

[[bin]]
name = "route-dispatch"
path = "src/bin/route-dispatch.rs"

[[bin]]
name = "validate-discover"
path = "src/bin/validate-discover.rs"

[[bin]]
name = "judge-pr"
path = "src/bin/judge-pr.rs"

[[bin]]
name = "execute-merge"
path = "src/bin/execute-merge.rs"

[[bin]]
name = "recall-fact"
path = "src/bin/recall-fact.rs"

[[bin]]
name = "hold-vision"
path = "src/bin/hold-vision.rs"

[[bin]]
name = "take-action"
path = "src/bin/take-action.rs"

[profile.release]
debug = false
