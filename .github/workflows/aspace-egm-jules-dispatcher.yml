name: "Aspace Factory · Autonomous EGM Goldfish & RigInfinity Dispatcher"

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      batch_size:
        description: "Number of Goldfish missions to dispatch"
        required: false
        default: "10"

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  dispatch-goldfish-swarm:
    name: "Elephant-Goldfish (EGM) × RigInfinity Rust Scheduler"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout A'Space OS V5
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Seed & Audit EGM Missions + RigInfinity Deterministic State
        run: |
          python3 01_Forkable/FKB01_Inference/03_Inference_FreeCloud/aspace_freecloud_gateway.py --self-test
          python3 01_Forkable/FKB00_Runtime/00_A0_Core/a0_holon_swarm_runtime.py
          python3 02_Factory/01_Kernel_Gates/daemon_supervisor_cordis.py --self-test
