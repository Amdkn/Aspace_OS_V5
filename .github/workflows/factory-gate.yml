name: "Aspace Factory — Gate & Security"

on:
  pull_request:
    branches: ["main", "master"]
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  pull-requests: write
  issues: write

jobs:
  factory-gate:
    name: "Deterministic Gate (5D Semantic AST + CAS Holons + 7R + OKF)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify OpenWiki is purged
        run: |
          if [ -f ".github/workflows/openwiki-update.yml" ] || [ -d "00_Memoire/openwiki" ]; then
            echo "::error::OpenWiki residue detected! WikiLLM is the sole wiki standard in V5."
            exit 1
          fi

      - name: Verify DOX & WikiLLM Schema Integrity
        run: |
          for f in AGENTS.md CLAUDE.md 00_Memoire/AGENTS.md 00_Memoire/bundle/index.md 00_Memoire/bundle/log.md 02_Factory/config.json; do
            if [ ! -f "$f" ]; then
              echo "::error::Missing required V5 Factory file: $f"
              exit 1
            fi
          done
          python3 -m json.tool 02_Factory/config.json > /dev/null
          python3 -m json.tool .claude/settings.json > /dev/null
          python3 -m json.tool .mcp.json > /dev/null

      - name: Execute Level 5 Semantic Gate (AST Taint + CAS Holons + OKF v0.2)
        run: |
          python3 02_Factory/semantic_gate.py

      - name: Append-Only Log Verification (on PRs)
        if: github.event_name == 'pull_request'
        run: |
          DEL=$(git diff "origin/${{ github.base_ref }}...HEAD" -- 00_Memoire/bundle/log.md | grep -E '^-([^-]|$)' | wc -l)
          if [ "$DEL" -gt 0 ]; then
            echo "::error::00_Memoire/bundle/log.md is APPEND-ONLY! Detected $DEL deleted/modified lines."
            exit 1
          fi
