name: "Aspace Factory · Security Triage (OWASP Top 10 × CodeQL × Reviewer-Security)"

on:
  push:
    branches: [ "master", "aspace-v5-native" ]
  pull_request:
    branches: [ "master" ]
  schedule:
    - cron: "15 2 * * *"
  workflow_dispatch:
    inputs:
      alert_source:
        description: "Trigger source (dependabot | codeql | secret_scanning | manual_owasp)"
        required: false
        default: "manual_owasp"

permissions:
  contents: write
  pull-requests: write
  security-events: write
  issues: write

jobs:
  reviewer-security-triage:
    name: "S1-RICK & Reviewer-Security · OWASP Top 10 & Worktree Patch"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout A'Space OS V5 (Submodules Meta-Graph)
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Autonomous Reviewer-Security Harness (OWASP Top 10 + Isolated Worktree)
        run: |
          python3 02_Factory/04_Security_OWASP_RigInfinity/reviewer_security_harness.py --self-test

      - name: Run Level 5 Semantic Gate
        run: |
          python3 02_Factory/semantic_gate.py
