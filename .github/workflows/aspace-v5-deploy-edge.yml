name: "A'Space OS V5 — Deploy to VPS & CoolEmbrl Edge"

on:
  push:
    branches: [ master, aspace-v5-native ]
  workflow_dispatch:
    inputs:
      deploy_target:
        description: "Cible de déploiement (all | vps_ssh | coolembrl_webhook)"
        required: false
        default: "all"

permissions:
  contents: read

jobs:
  factory-gate-and-deploy:
    name: "Deterministic Gate (7/7) & Edge Sync (VPS + CoolEmbrl WSL)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout A'Space OS V5 (Submodules Meta-Graph)
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Cross-Platform Deterministic Factory Gates (Level 5 + 578 Holons QC + Cordis Supervisor)
        shell: pwsh
        run: |
          Write-Host "=== [1/4] Level 5 Semantic Gate ===" -ForegroundColor Cyan
          python3 02_Factory/semantic_gate.py
          if ($LASTEXITCODE -ne 0) { exit 1 }

          Write-Host "=== [2/4] Cordis Master Daemon x Automaton Runtime Check ===" -ForegroundColor Cyan
          python3 02_Factory/01_Kernel_Gates/daemon_supervisor_cordis.py
          if ($LASTEXITCODE -ne 0) { exit 1 }

          Write-Host "=== [3/4] OpenRig Demo QC 578 Holons x Rust Determinism Check ===" -ForegroundColor Cyan
          python3 02_Factory/02_Holons_578_QualityControl/openrig_demo_qc_578.py
          if ($LASTEXITCODE -ne 0) { exit 1 }

          Write-Host "=== [4/4] CoolEmbrl WSL & VPS Edge Readiness Audit ===" -ForegroundColor Cyan
          python3 02_Factory/07_Edge_CoolEmbrl_VPS/sync_coolembrl_and_vps.py --self-test
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Sync to VPS / CoolEmbrl Edge via SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          COOLIFY_WEBHOOK_URL: ${{ secrets.COOLIFY_WEBHOOK_URL }}
          COOLEMBRL_WEBHOOK_URL: ${{ secrets.COOLEMBRL_WEBHOOK_URL }}
        if: env.VPS_HOST != '' && env.SSH_PRIVATE_KEY != ''
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

          echo "Synchronisation des 578 Holons et du Méta-Repo vers le VPS/CoolEmbrl..."
          rsync -avz --exclude '.git' ./ "$VPS_USER@$VPS_HOST:~/Aspace_OS_V5/"

          echo "Vérification du démon EGM Gateway (:31415) & Superviseur Cordis sur le VPS..."
          ssh "$VPS_USER@$VPS_HOST" "cd ~/Aspace_OS_V5 && python3 01_Forkable/FKB01_Inference/03_Inference_FreeCloud/aspace_freecloud_gateway.py --self-test && python3 02_Factory/01_Kernel_Gates/daemon_supervisor_cordis.py"

      - name: Trigger CoolEmbrl / Coolify Edge Webhooks (if configured)
        env:
          COOLIFY_WEBHOOK_URL: ${{ secrets.COOLIFY_WEBHOOK_URL }}
          COOLEMBRL_WEBHOOK_URL: ${{ secrets.COOLEMBRL_WEBHOOK_URL }}
        run: |
          if [ -n "$COOLIFY_WEBHOOK_URL" ]; then
            curl -fsSL -X POST "$COOLIFY_WEBHOOK_URL" || true
          fi
          if [ -n "$COOLEMBRL_WEBHOOK_URL" ]; then
            curl -fsSL -X POST "$COOLEMBRL_WEBHOOK_URL" || true
          fi
