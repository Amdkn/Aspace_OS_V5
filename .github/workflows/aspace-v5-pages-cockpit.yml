name: "A'Space OS V5 — Pages & Live Factory Telemetry Artifact"

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build-factory-cockpit-snapshot:
    name: "Build 578-Holons & EGM Telemetry Snapshot"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout A'Space OS V5
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate Live Telemetry Bundle (`dist-cockpit/`)
        run: |
          mkdir -p dist-cockpit
          cp 02_Factory/05_3DWorlds_Fractal_Deploy/dashboard.html dist-cockpit/index.html
          cp 00_Memoire/bundle/areas_os/J1_Jerry_Macro_CrossOS/registry-578-holons.json dist-cockpit/registry-578-holons.json
          python3 02_Factory/02_Holons_578_QualityControl/openrig_demo_qc_578.py > dist-cockpit/qc-578-report.json
          python3 02_Factory/01_Kernel_Gates/daemon_supervisor_cordis.py > dist-cockpit/cordis-daemon-status.json

      - name: Upload Cockpit Telemetry Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aspace-v5-factory-cockpit
          path: dist-cockpit/
          retention-days: 14
