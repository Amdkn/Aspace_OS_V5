name: "🚀 Factory Epic / Release PRD"
description: "Décrire une Release ou un Epic complet que l'agent découpera en Issues liées exécutables en parallèle"
title: "[EPIC] "
labels: ["factory:epic"]
body:
  - type: textarea
    id: prd
    attributes:
      label: "Vision & PRD de la Release"
      description: "L'agent Intake découpera cet Epic en sous-issues atomiques avec graphe de dépendances (DAG)."
    validations:
      required: true
  - type: textarea
    id: journeys
    attributes:
      label: "Parcours de validation Staging (Customer Journeys)"
      placeholder: "1. L'utilisateur lance...\n2. Le système vérifie..."
    validations:
      required: false
