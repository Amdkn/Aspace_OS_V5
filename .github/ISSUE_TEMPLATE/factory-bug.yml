name: "🐛 Factory Bug / Self-Heal"
description: "Signaler un bug, une régression CI ou un échec d'agent à corriger automatiquement"
title: "[BUG] "
labels: ["factory", "bug"]
body:
  - type: textarea
    id: symptom
    attributes:
      label: "Symptôme exact / Commande en échec"
      placeholder: "Colle l'erreur exacte ou la commande qui reproduit le problème."
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: "Fichiers ou périmètre suspecté"
      placeholder: "Ex: 00_Memoire/hooks/, .vscode/doctor.ps1"
    validations:
      required: false
